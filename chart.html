
<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Trading Buy+ | גרף חי</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e0e;
      color: white;
    }
    nav {
      background: #111;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .logo {
      color: gold;
      font-size: 1.2em;
      font-weight: bold;
    }
    nav select {
      padding: 6px;
      font-size: 1em;
      background: #222;
      color: white;
      border: 1px solid gold;
      border-radius: 6px;
    }
    section {
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: gold;
      margin-bottom: 10px;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
      margin-top: 20px;
      border-radius: 8px;
    }
    .controls {
      margin-top: 30px;
    }
    .controls button {
      margin: 5px;
      padding: 10px 20px;
      font-weight: bold;
      background: gold;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .controls button:hover {
      background: #ffd700;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Trading Buy+</div>
    <div>
      <label for="assetSelect" style="margin-right:10px;">בחר נכס:</label>
      <select id="assetSelect">
        <option value="MES">MES</option>
        <option value="MNQ">MNQ</option>
        <option value="AAPL">AAPL</option>
        <option value="TSLA">TSLA</option>
        <option value="BTCUSD">BTC/USD</option>
        <option value="ETHUSD">ETH/USD</option>
        <option value="SPY">SPY</option>
        <option value="GOOG">GOOG</option>
        <option value="AMZN">AMZN</option>
      </select>
    </div>
  </nav>

  <section>
    <h1>גרף בזמן אמת</h1>
    <p>הצג גרף חי של הנכס שנבחר</p>
    <iframe id="tradingviewChart" src="https://s.tradingview.com/widgetembed/?frameElementId=tradingviewChart&symbol=NASDAQ:MES&interval=5&theme=dark&style=1" allowtransparency="true" scrolling="no" allowfullscreen=""></iframe>
    
    <div class="controls">
      <button onclick="toggleAI()">מעבר לניתוח AI</button>
      <button onclick="resetChart()">נקה גרף</button>
    </div>
  </section>

  <script>
    const assetSelect = document.getElementById('assetSelect');
    const chartIframe = document.getElementById('tradingviewChart');

    const getSymbolURL = (symbol) => {
      if (symbol === 'BTCUSD') return 'BINANCE:BTCUSDT';
      if (symbol === 'ETHUSD') return 'BINANCE:ETHUSDT';
      if (symbol === 'MES') return 'CME_MINI:MES1!';
      if (symbol === 'MNQ') return 'CME_MINI:MNQ1!';
      if (symbol === 'SPY') return 'AMEX:SPY';
      return `NASDAQ:${symbol}`;
    }

    assetSelect.addEventListener('change', () => {
      const selected = assetSelect.value;
      const urlSymbol = getSymbolURL(selected);
      const url = `https://s.tradingview.com/widgetembed/?frameElementId=tradingviewChart&symbol=${urlSymbol}&interval=5&theme=dark&style=1`;
      chartIframe.src = url;
    });

    function toggleAI() {
      alert("מעבר לניתוח AI (פיצ'ר בהמשך)");
    }

    function resetChart() {
      assetSelect.selectedIndex = 0;
      assetSelect.dispatchEvent(new Event('change'));
    }
  </script>
</body>
</html>

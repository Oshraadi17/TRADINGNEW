
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRADING BUY+</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Assistant', sans-serif;
      }

      body, html {
        height: 100%;
        direction: rtl;
      }

      .background {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        color: white;
        text-align: center;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1;
      }

      .content {
        z-index: 2;
      }

      h1 {
        font-size: 48px;
        color: #FFD700;
        margin-bottom: 20px;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      p {
        font-size: 18px;
        margin-bottom: 30px;
      }

      button {
        background-color: #FFA500;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 18px;
        border-radius: 30px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #ff8800;
      }
    </style>
  </head>
  <body>
    <div class="background">
      <div class="overlay"></div>
      <div class="content">
        <h1>TRADING BUY+</h1>
        <h2>הגבול בין ויעצון לגאונות — מתחיל כאן</h2>
        <p>מערכת המסחר מחכירה את העתיד</p>
        <button onclick="window.location.href='home.html'">מתחילים</button>
      </div>
    </div>
  </body>
</html>

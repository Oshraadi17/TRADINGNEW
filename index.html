
<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Language" content="he, en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADING BUY+</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-hebrew: 'Assistant', sans-serif;
      --font-english: 'Orbitron', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-hebrew);
      background-color: #0d0d0d;
    }

    [lang='en'] body {
      direction: ltr;
      font-family: var(--font-english);
    }

    [lang='he'] body {
      direction: rtl;
      font-family: var(--font-hebrew);
    }

    .hero {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(to bottom right, rgba(20,20,40,0.6), rgba(0,0,0,0.75));
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 90%;
      padding: 20px;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #00BFFF;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
    }

    p {
      font-size: 1.6rem;
      margin-bottom: 2rem;
      color: #C0C0C0;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .btn {
      background: linear-gradient(90deg, #4A90E2, #6A5ACD);
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-family: 'Orbitron', sans-serif;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
    }

    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 25px rgba(106, 90, 205, 0.6);
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #A9A9A9;
      font-size: 0.9rem;
      z-index: 1;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lang = navigator.language || navigator.userLanguage;
      if (lang.startsWith('en')) {
        document.documentElement.lang = 'en';
        document.body.innerHTML = `
          <div class="hero">
            <div class="overlay"></div>
            <div class="content">
              <h1>TRADING BUY+</h1>
              <p>The line between madness and genius — begins here</p>
              <button class="btn" onclick="window.location.href='home.html'">Get Started</button>
            </div>
            <footer>Terms of Service | Privacy Policy</footer>
          </div>
        `;
      }
    });
  </script>
</head>
<body>
  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1>TRADING BUY+</h1>
      <p>הגבול בין שיגעון לגאונות — מתחיל כאן</p>
      <button class="btn" onclick="window.location.href='home.html'">מתחילים</button>
    </div>
    <footer>תנאי שימוש | מדיניות פרטיות</footer>
  </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADING BUY+</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: url('A_digital_illustration_in_the_image_showcases_a_mo.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    header {
      width: 100%;
      padding: 24px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      position: fixed;
      top: 0;
      z-index: 1000;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #ffffff;
      font-size: 16px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00ffe7;
    }

    .chat-ai {
      padding: 10px 18px;
      border: 2px solid #00b3ff;
      border-radius: 24px;
      color: #00b3ff;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .chat-ai:hover {
      background: #00b3ff;
      color: #000;
    }

    .hero {
      padding: 180px 60px 100px;
      max-width: 600px;
    }

    .hero h1 {
      font-size: 56px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #00d8ff;
      margin-bottom: 30px;
    }

    .btn-start {
      background: linear-gradient(90deg, #a000ff, #ff00c8);
      padding: 14px 36px;
      font-size: 18px;
      color: #fff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s;
    }

    .btn-start:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 36px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <div class="logo">+ TRADING BUY</div>
      <nav>
        <a href="#">Markets</a>
        <a href="#">News</a>
        <a href="#">Screeners</a>
        <a href="#">Community</a>
      </nav>
    </div>
    <button class="chat-ai">Chat AI</button>
  </header>

  <section class="hero">
    <h1>Navigate the Markets</h1>
    <p>Daily News Update</p>
    <button class="btn-start">Get Started</button>
  </section>

  <footer>
    &copy; TRADING BUY+. All rights reserved.
  </footer>

</body>
</html>

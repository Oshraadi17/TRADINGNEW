
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="he, en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADING BUY+</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-he: 'Assistant', sans-serif;
      --font-en: 'Orbitron', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: var(--font-he);
      background-color: #0d0d0d;
    }

    body {
      overflow: hidden;
    }

    .hero {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      color: white;
    }

    .overlay {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(to bottom right, rgba(20,20,40,0.6), rgba(0,0,0,0.75));
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 90%;
      padding: 20px;
    }

    h1 span, p span, .btn span, footer span {
      display: none;
    }

    h1, p, .btn, footer {
      font-size: 1.6rem;
    }

    .btn {
      background: linear-gradient(90deg, #4A90E2, #6A5ACD);
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
      font-family: var(--font-en);
      margin-top: 20px;
    }

    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 25px rgba(106, 90, 205, 0.6);
    }

    .language-switch {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 3;
    }

    .language-switch button {
      background: none;
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      margin: 0 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #A9A9A9;
      font-size: 0.9rem;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="overlay"></div>
    <div class="language-switch">
      <button onclick="setLanguage('he')">עברית</button>
      <button onclick="setLanguage('en')">English</button>
    </div>
    <div class="content">
      <h1>
        <span lang="he">TRADING BUY+</span>
        <span lang="en">TRADING BUY+</span>
      </h1>
      <p>
        <span lang="he">הגבול בין שיגעון לגאונות — מתחיל כאן</span>
        <span lang="en">The line between madness and genius — begins here</span>
      </p>
      <button class="btn" onclick="window.location.href='home.html'">
        <span lang="he">מתחילים</span>
        <span lang="en">Get Started</span>
      </button>
    </div>
    <footer>
      <span lang="he">תנאי שימוש | מדיניות פרטיות</span>
      <span lang="en">Terms of Service | Privacy Policy</span>
    </footer>
  </div>

  <script>
    function setLanguage(lang) {
      document.querySelectorAll('[lang]').forEach(el => {
        el.style.display = (el.getAttribute('lang') === lang) ? '' : 'none';
      });
      localStorage.setItem('lang', lang);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('en') ? 'en' : 'he');
      setLanguage(savedLang);
    });
  </script>
</body>
</html>

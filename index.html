
<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRADING BUY+</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      direction: rtl;
      background: url('TRADING.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      width: 100%;
      top: 0;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 999;
    }

    .nav-links a {
      margin: 0 15px;
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #00ffe7;
    }

    .ai-button {
      background-color: #00ffe7;
      color: black;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-weight: bold;
      text-align: center;
      line-height: 42px;
      font-size: 20px;
      margin-left: 16px;
      cursor: pointer;
      box-shadow: 0 0 12px #00ffe7;
    }

    .hero {
      text-align: right;
      padding: 220px 60px 160px;
    }

    .hero h1 {
      font-size: 42px;
      color: #00ffe7;
      text-shadow: 0 0 10px #00ffe7;
      margin-bottom: 20px;
    }

    .btn-start {
      margin-top: 20px;
      padding: 14px 34px;
      font-size: 18px;
      background: #00ffe7;
      color: #000;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px #00ffe7;
      transition: transform 0.3s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 40px;
      background: rgba(0, 0, 0, 0.6);
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-links">
      <a href="#">גרפים</a>
      <a href="#">AI</a>
      <a href="#">קהילה</a>
      <a href="#">התחברות</a>
    </div>
    <div class="ai-button">🤖</div>
  </header>

  <div class="hero">
    <h1>הגבול בין שיגעון לגאונות — מתחיל כאן</h1>
    <button class="btn-start">התחל</button>
  </div>

  <footer>
    כל הזכויות שמורות © TRADING BUY+
  </footer>

</body>
</html>
